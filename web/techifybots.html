<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:image" content="https://i.ibb.co/M8S0Zzj/live-streaming.png" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tudubotz</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    .logo-icon i {
      -webkit-text-fill-color: white !important;
      background: none !important;
    }

    * {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    :root {
      --bg-primary: #07090e;
      --bg-secondary: #121622;
      --bg-tertiary: #1c2233;
      --bg-glass: rgba(28, 34, 51, 0.8);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #0ea5e9;
      --accent-secondary: #6366f1;
      --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      width: 100%;
    }

    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.4;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.06) 0%, transparent 50%);
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow-x: hidden;
    }

    header {
      background: rgba(18, 22, 34, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 16px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      width: 100%;
      gap: 12px;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      white-space: nowrap;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: var(--accent-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      flex-shrink: 0;
    }

    .live-badge {
      background: var(--danger);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #file-name {
      flex: 1;
      margin: 0 12px;
      overflow: hidden;
      min-width: 0;
    }

    #file-name marquee {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 15px;
    }

    .main-container {
      flex: 1;
      padding: 30px 4%;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }

    .player-wrapper {
      width: 100%;
      min-width: 0;
    }

    .player-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      position: relative;
      width: 100%;
    }

    .player {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      display: block;
    }

    .video-info {
      padding: 24px;
      background: linear-gradient(to bottom, var(--bg-secondary), transparent);
    }

    .video-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .video-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      flex: 1;
    }

    .bookmark-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      color: var(--text-secondary);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bookmark-btn.bookmarked {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    .video-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-item.quality {
      background: rgba(14, 165, 233, 0.15);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      font-weight: 700;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .action-btn {
      padding: 12px 16px;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      text-decoration: none;
    }

    .action-btn:hover {
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--accent-gradient);
      border-color: transparent;
      color: white;
    }

    .btn-vlc {
      background: #ff5722;
      border-color: transparent;
      color: white;
    }

    .btn-mx {
      background: #8bc34a;
      border-color: transparent;
      color: white;
    }

    .sidebar {
      position: sticky;
      top: 100px;
      width: 100%;
      max-width: 360px;
    }

    .sidebar-card {
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-title i {
      color: var(--accent-primary);
    }

    .stats-grid {
      display: grid;
      gap: 12px;
    }

    .stat-card {
      background: var(--bg-tertiary);
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
    }

    .quality-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--accent-gradient);
      color: white;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    footer {
      background: var(--bg-secondary);
      padding: 30px 4%;
      border-top: 1px solid var(--border);
      margin-top: 60px;
      text-align: center;
    }

    .footer-copyright {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      color: var(--text-primary);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--success);
      transform: translateY(150px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 10000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 1200px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-width: 100%;
      }
    }
  </style>
</head>

<body oncontextmenu="return false">
  <div class="app-wrapper">
    <!-- Header -->
    <header>
      <div class="logo-wrapper">
        <div class="logo">
          <div class="logo-icon">
            <i class="fa-solid fa-robot"></i>
          </div>
          <span>Tudubotz</span>
        </div>
        <div class="live-badge">
          <span>Live</span>
        </div>
      </div>
      
      <div id="file-name">
        <marquee direction="left">{{file_name}}</marquee>
      </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Player Section -->
      <div class="player-wrapper">
        <div class="player-container">
          <video src="{{file_url}}" class="player" playsinline controls poster="https://i.ibb.co/zVcfdXV4/x.png"></video>
          
          <div class="video-info">
            <div class="video-header">
              <h1 class="video-title">{{file_name}}</h1>
              <button class="bookmark-btn" id="bookmarkBtn" title="Save">
                <i class="far fa-bookmark"></i>
              </button>
            </div>
            
            <div class="video-stats">
              <div class="stat-item quality">
                <i class="fas fa-crown"></i>
                <span>HD Stream</span>
              </div>
            </div>

            <div class="action-buttons">
              <button class="action-btn btn-primary" onclick="copyLink()">
                <i class="fas fa-link"></i>
                <span>Copy Link</span>
              </button>
              <a href="#" id="vlcBtn" class="action-btn btn-vlc">
                <i class="fas fa-play-circle"></i>
                <span>Play in VLC</span>
              </a>
              <a href="#" id="mxBtn" class="action-btn btn-mx">
                <i class="fas fa-video"></i>
                <span>Play in MX</span>
              </a>
              <button class="action-btn" onclick="downloadVideo()">
                <i class="fas fa-download"></i>
                <span>Download</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-card">
          <div class="sidebar-title">
            <i class="fas fa-chart-line"></i>
            Stream Stats
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Quality</div>
              <div class="stat-value">
                <span class="quality-badge" id="qualityBadge">
                  <i class="fas fa-film"></i> 1080p
                </span>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Status</div>
              <div class="stat-value" style="color: var(--success);">Online</div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-copyright">
        © 2026 Tudubotz. All rights reserved.
      </div>
    </footer>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <div class="toast-content">
      <div class="toast-title" id="toastTitle">Success!</div>
      <div class="toast-message" id="toastMessage">Action completed</div>
    </div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const player = new Plyr('.player');
      
      const videoSrc = "{{file_url}}";
      
      // VLC Player intent/protocol links setup
      const vlcAnchor = document.getElementById('vlcBtn');
      vlcAnchor.href = `vlc://${videoSrc}`;
      
      // MX Player intent link setup for Android devices
      const mxAnchor = document.getElementById('mxBtn');
      mxAnchor.href = `intent:${videoSrc}#intent;package=com.mxtech.videoplayer.ad;type=video/*;end`;
    });

    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('Success!', 'Link copied to clipboard');
      });
    }

    function downloadVideo() {
      showToast('Info', 'Downloading video...');
      const player = document.querySelector('.player');
      const link = document.createElement('a');
      link.href = player.src;
      link.download = 'video';
      link.click();
    }

    function showToast(title, message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMessage').textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
